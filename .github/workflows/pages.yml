name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the question bank before publishing
        run: node scripts/validate-questions.js

      # Pages must already be switched on for the repository, under
      # Settings -> Pages -> Source -> GitHub Actions. That is a one-time
      # manual step: creating a Pages site needs admin rights on the repo,
      # which the workflow's GITHUB_TOKEN never has, so `enablement: true`
      # here cannot do it for you (it fails with "Resource not accessible
      # by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
